<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Infinite Tic-Tac-Toe</title>  <!-- replaced on load by STRINGS.page.title -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- All player-facing text lives in js/strings.js. Elements below carry data-str attributes naming
       the string that fills them (see applyPageStrings in js/strings.js). Don't type text here. -->
  <canvas id="scene" data-str-label="page.sceneLabel"></canvas>

  <header class="hud-top">
    <div class="brand">
      <span class="brand-x">X</span><span class="brand-o">O</span>
      <span class="brand-text" data-str="page.brand"></span>
    </div>
    <div class="level-box" data-str-title="page.levelBoxTitle">
      <div class="level-label" data-str="page.topLevel"></div>
      <div id="topLevel" class="level-num">0</div>
      <div id="bestLevel" class="level-best"></div>
    </div>
  </header>

  <div id="rulepin" class="rulepin" aria-live="polite"></div>
  <nav id="path" class="path" data-str-label="page.pathLabel"></nav>
  <div id="stakes" class="stakes" aria-live="polite"></div>
  <canvas id="minimap" class="minimap" data-str-label="page.minimapLabel"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="banner" class="banner" aria-hidden="true"></div>

  <div id="zoombar" class="zoombar" data-str-label="page.zoomBarLabel">
    <div class="zb-label" data-str="page.zoom"></div>
    <button id="zOut" type="button" data-str-title="page.zoomOutTitle">−</button>
    <div id="zLevels" class="zlevels"></div>
    <button id="zIn" type="button" data-str-title="page.zoomInTitle">+</button>
    <button id="zLive" type="button" class="zlive" data-str-title="page.zoomLiveTitle" data-str="page.zoomLive"></button>
  </div>

  <div class="hud-bottom">
    <div id="rulebadge" class="rulebadge" aria-live="polite"></div>
    <div id="turn" class="turn"></div>
    <div class="controls">
      <button id="btnNew" type="button" data-str="page.newGame"></button>
      <button id="btnCpu" type="button"></button>
      <button id="btnSound" type="button"></button>
      <button id="btnMix" type="button" aria-expanded="false" aria-controls="mixer" data-str-title="page.mixTitle" data-str="page.mix"></button>
      <button id="btnReview" type="button" data-str-title="page.reviewTitle" data-str="page.review"></button>
      <button id="btnHelp" type="button" data-str="page.howToPlay"></button>
    </div>
  </div>

  <div id="replaybar" class="replaybar" hidden>
    <div class="rp-row"><span class="rp-live" data-str="review.live"></span><span id="rpTitle" class="rp-title"></span></div>
    <div class="rp-track"><div id="rpFill" class="rp-fill"></div></div>
    <div class="rp-row rp-btns">
      <button id="rpPause" type="button" data-str="review.pause"></button>
      <button id="rpSpeed" type="button" data-str-title="review.speedTitle"></button>
      <button id="rpStop" type="button" class="rp-stop" data-str="review.stop"></button>
    </div>
  </div>

  <div id="review" class="modal" hidden>
    <div class="modal-card review-card">
      <h2 data-str="review.title"></h2>
      <p class="hint" data-str="review.hint"></p>
      <ol id="rvList" class="rv-list"></ol>
      <button id="rvClose" type="button" class="primary" data-str="review.close"></button>
    </div>
  </div>

  <div id="mixer" class="mixer" hidden>
    <div class="mx-title" data-str="page.mixerTitle"></div>
    <label class="mx-row"><span data-str="page.mixerSfx"></span><input id="mxSfx" type="range" min="0" max="100" step="1"><b id="mxSfxV"></b></label>
    <label class="mx-row"><span data-str="page.mixerVoices"></span><input id="mxVox" type="range" min="0" max="100" step="1"><b id="mxVoxV"></b></label>
    <button id="mxTest" type="button" data-str="page.mixerTest"></button>
  </div>

  <div id="slots" class="slots" hidden>
    <div class="slot-stage">
    <div class="slot-machine">
      <div class="slot-ring" aria-hidden="true"></div>
      <div class="slot-crew" aria-hidden="true"></div>
      <div class="slot-title" data-str-label="slots.titleLabel"><span class="mj-burst" aria-hidden="true"></span><span class="mj-mystery" aria-hidden="true" data-str="slots.titleSmall"></span><span class="mj-jackpot" aria-hidden="true" data-str-letters="slots.titleBig"></span><span class="mj-spark s1">✦</span><span class="mj-spark s2">✦</span><span class="mj-spark s3">✧</span><span class="mj-spark s4">✦</span></div>
      <div class="slot-who"></div>
      <div class="slot-body">
        <div class="reels"><svg class="winlines" preserveAspectRatio="none"></svg></div>
        <div class="slot-pop" data-pop="symbols" hidden>
          <div class="pop-head"><span data-str="slots.howHead"></span><button type="button" class="pop-x" data-str-label="slots.close">×</button></div>
          <p class="pop-text" data-str="slots.howText"></p>
          <div class="paytable"></div>
        </div>
        <div class="slot-pop" data-pop="lines" hidden>
          <div class="pop-head"><span data-str="slots.linesHead"></span><button type="button" class="pop-x" data-str-label="slots.close">×</button></div>
          <p class="pop-text" data-str="slots.linesText"></p>
          <div class="lines"></div>
        </div>
      </div>
      <div class="slot-controls">
        <button type="button" class="slot-tab" data-open="symbols" data-str="slots.symbolsTab"></button>
        <div class="slot-mid"><div class="slot-result"></div><button id="slotSpin" type="button" class="spin-btn" data-str="slots.spin"></button></div>
        <button type="button" class="slot-tab" data-open="lines" data-str="slots.paylinesTab"></button>
      </div>
    </div>
    </div>
  </div>

  <div id="devpanel" class="devpanel" hidden>
    <div class="dv-head"><span data-str="dev.head"></span><button id="dvClose" type="button" data-str-title="dev.closeTitle">×</button></div>
    <label class="dv-row"><span data-str="dev.slotResult"></span><select id="dvForce"></select></label>
    <label class="dv-check"><input type="checkbox" id="dvTease"> <span data-str="dev.tease"></span></label>
    <button id="dvSpin" type="button" class="dv-spin" data-str="dev.spinJackpot"></button>
    <label class="dv-check"><input type="checkbox" id="dvEvery"> <span data-str="dev.everywhere"></span></label>
    <label class="dv-check"><input type="checkbox" id="dvReveal"> <span data-str="dev.reveal"></span></label>
    <label class="dv-row"><span data-str="dev.wheelResult"></span><select id="dvWheel"></select></label>
    <label class="dv-check"><input type="checkbox" id="dvNearMiss"> <span data-str="dev.nearMiss"></span></label>
    <button id="dvWheelSpin" type="button" class="dv-spin" data-str="dev.spinWheel"></button>
    <div class="dv-hint" data-str="dev.hint"></div>
  </div>

  <div id="rulecard" class="rulecard" aria-live="polite"></div>

  <div id="wheel" class="wheelov" hidden>
    <div class="wh-panel">
      <div class="wh-title" data-str-label="wheel.titleLabel"><span class="wt-burst" aria-hidden="true"></span><span class="wt-wheel" aria-hidden="true"></span><span class="wt-words" aria-hidden="true"><span class="wt-of" data-str="wheel.titleSmall"></span><span class="wt-games" data-str-letters="wheel.titleBig" data-colors="#ff3b5c,#ff9f1c,#ffe14d,#3ddc84,#29d3ff,#c86bff"></span></span><span class="wt-wheel r" aria-hidden="true"></span><span class="mj-spark s1">✦</span><span class="mj-spark s2">✦</span><span class="mj-spark s3">✧</span></div>
      <div class="wh-who"></div>
      <div class="wh-stage">
        <canvas class="wh-canvas" data-str-label="wheel.canvasLabel"></canvas>
        <div class="wh-pointer"></div>
        <button type="button" class="wh-spin" data-str="wheel.spin"></button>
      </div>
      <div class="wh-result"></div>
    </div>
  </div>

  <div id="rulepick" class="rulepick" hidden>
    <div class="rp-panel">
      <div class="rp-title" data-str="rulePick.title"></div>
      <div class="rp-who"></div>
      <div class="rp-cards"></div>
      <div class="rp-hint"></div>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="modal-card">
      <h2 data-str="help.title"></h2>
      <ol id="helpSteps"></ol>  <!-- filled by Game.buildHelp() from STRINGS.help.steps and STRINGS.rules -->
      <p class="hint" data-str="help.hint"></p>
      <button id="btnCloseHelp" type="button" class="primary" data-str="help.close"></button>
    </div>
  </div>

  <script src="js/timing.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/sound-config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/render.js"></script>
  <script src="js/minimap.js"></script>
  <script src="js/crew.js"></script>
  <script src="js/boom.js"></script>
  <script src="js/slots.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
